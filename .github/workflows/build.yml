name: Android App APK Build

on:
  workflow_dispatch:

# Only the release job may write. Actions are pinned to a commit: a tag can
# be moved to other code, a commit cannot.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.app.outputs.apk }}
      version: ${{ steps.app.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Setup repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Get app info from app.json
        id: app
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.slug")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=${APP_NAME}_${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, type-check and test
        run: |
          bun run check
          bun run typecheck
          bun test

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Generate the Android project
        run: bunx expo prebuild --platform android --no-install

      - name: Build Android app
        env:
          APK: ${{ steps.app.outputs.apk }}
        run: |
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release
          path: ${{ steps.app.outputs.apk }}
          if-no-files-found: error

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # Runs none of the repository's code, nor its dependencies': it only
  # publishes the APK built above.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-release

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ needs.build.outputs.apk }}
          fail_on_unmatched_files: true
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## What's Changed
            ${{ needs.build.outputs.changelog }}
